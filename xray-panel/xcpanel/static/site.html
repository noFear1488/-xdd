<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{domain}}</title>
<style>
  :root { color-scheme: light dark; --fg: #1d2420; --muted: #5b665f; --bg: #f6f5f0; --line: #dcdcd2; }
  @media (prefers-color-scheme: dark) { :root { --fg: #e6e9e4; --muted: #9aa49c; --bg: #141816; --line: #2b322e; } }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 17px/1.6 Georgia, "Iowan Old Style", serif; }
  main { max-width: 36rem; margin: 0 auto; padding: 18vh 1.25rem 4rem; }
  h1 { font-size: 1.6rem; font-weight: normal; margin: 0 0 1.5rem; letter-spacing: .01em; }
  p { margin: 0 0 1rem; color: var(--muted); }
  footer { margin-top: 3rem; padding-top: 1rem; border-top: 1px solid var(--line); font-size: .85rem; color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>{{domain}}</h1>
  <p>Notes on walks, trees and slow weekends, written down mostly so I remember them.</p>
  <p>The archive is being moved to a new home and will be back soon.</p>
  <footer>&copy; {{domain}}</footer>
</main>
</body>
</html>
