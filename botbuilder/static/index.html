<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Конструктор ботов</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' rx='4' fill='%232f7de1'/><path d='M4 8h8M8 4v8' stroke='white' stroke-width='2'/></svg>">
<style>
:root {
  --bg: #f5f6f8; --panel: #ffffff; --line: #e3e6eb; --text: #1b1f24; --muted: #6b7280;
  --accent: #2f7de1; --accent-text: #ffffff; --ok: #1f9d55; --warn: #b7791f; --bad: #d64545;
  --chat-bg: #dfe9f2; --bubble-bot: #ffffff; --bubble-user: #d9f7c6; --kbd: #f0f3f6;
  --code-bg: #f7f8fa; --sel: #eaf2fd;
  --radius: 10px; --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #111418; --panel: #191d22; --line: #2a3038; --text: #e6e9ed; --muted: #8b949e;
    --accent: #4a90e2; --ok: #3fb950; --warn: #d29922; --bad: #f05d5d;
    --chat-bg: #0e1621; --bubble-bot: #182533; --bubble-user: #2b5278; --kbd: #22303e;
    --code-bg: #14181d; --sel: #1d2a3a;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--text); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; display: flex; flex-direction: column; }
button, input, select, textarea { font: inherit; color: inherit; }
input, select, textarea { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 7px 9px; width: 100%; }
input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
textarea { resize: vertical; min-height: 96px; }
.bad { border-color: var(--bad) !important; }
button { white-space: nowrap; cursor: pointer; border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 7px 12px; }
button:hover { border-color: var(--accent); }
button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
button.danger:hover { border-color: var(--bad); color: var(--bad); }
button.icon { padding: 6px 9px; line-height: 1; }
button:disabled { opacity: .5; cursor: default; }

header { display: flex; gap: 10px; align-items: center; padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--panel); flex-wrap: wrap; }
header .name { font-weight: 600; max-width: 220px; }
header .grow { flex: 1; }
header .token { max-width: 260px; }
.pill { font-size: 12px; padding: 3px 9px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.pill.on { color: var(--ok); border-color: var(--ok); }
.pill.err { color: var(--bad); border-color: var(--bad); }
.saved { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 260px; }

main { flex: 1; display: grid; grid-template-columns: 280px minmax(0, 1fr) 400px; min-height: 0; }
section, aside { min-height: 0; overflow: auto; }
aside { border-right: 1px solid var(--line); padding: 12px; display: flex; flex-direction: column; gap: 6px; }
.add { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 6px; }
.add button { font-size: 13px; padding: 6px 8px; }
.item { display: block; width: 100%; text-align: left; border: 1px solid transparent; background: none; padding: 8px 10px; border-radius: var(--radius); }
.item:hover { background: var(--sel); border-color: transparent; }
.item.active { background: var(--sel); border-color: var(--accent); }
.item .trig { font-family: var(--mono); font-size: 12.5px; display: flex; gap: 6px; align-items: center; }
.item .snippet { color: var(--muted); font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; flex: none; }
.dot.error { background: var(--bad); } .dot.warning { background: var(--warn); }
.tag { font-size: 11px; color: var(--muted); border: 1px solid var(--line); border-radius: 5px; padding: 0 5px; font-family: system-ui, sans-serif; }

.editor { padding: 18px 22px; display: flex; flex-direction: column; gap: 16px; max-width: 760px; }
.editor h2 { margin: 0; font-size: 16px; }
.row { display: flex; gap: 8px; align-items: center; }
.field label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 5px; }
.hint { font-size: 12px; color: var(--muted); margin-top: 4px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; flex-wrap: wrap; }
.seg button { border: 0; border-radius: 0; border-right: 1px solid var(--line); }
.seg button:last-child { border-right: 0; }
.seg button.on { background: var(--accent); color: var(--accent-text); }
.prefixed { display: flex; align-items: center; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); }
.prefixed span { padding-left: 9px; color: var(--muted); font-family: var(--mono); }
.prefixed input { border: 0; font-family: var(--mono); }
.btnrow { display: grid; grid-template-columns: minmax(0, 1.2fr) 100px minmax(0, 1fr) auto auto; gap: 6px; margin-bottom: 6px; }
.btnrow input[data-b="value"] { font-family: var(--mono); font-size: 13px; }
.check { display: flex; gap: 8px; align-items: center; }
.check input { width: auto; }
.issues { display: flex; flex-direction: column; gap: 4px; }
.issue { font-size: 13px; padding: 6px 10px; border-radius: 8px; border-left: 3px solid; background: var(--code-bg); }
.issue.error { border-color: var(--bad); } .issue.warning { border-color: var(--warn); }
.issue a { color: inherit; }
.empty { color: var(--muted); padding: 24px; text-align: center; }

.right { border-left: 1px solid var(--line); display: flex; flex-direction: column; }
.tabs { display: flex; border-bottom: 1px solid var(--line); background: var(--panel); }
.tabs button { border: 0; border-radius: 0; background: none; padding: 10px 14px; color: var(--muted); border-bottom: 2px solid transparent; }
.tabs button.on { color: var(--text); border-bottom-color: var(--accent); }
.tabs .grow { flex: 1; }
.pane { flex: 1; min-height: 0; display: none; flex-direction: column; }
.pane.on { display: flex; }
.chat { flex: 1; overflow: auto; background: var(--chat-bg); padding: 14px; display: flex; flex-direction: column; gap: 8px; }
.msg { max-width: 85%; }
.msg.user { align-self: flex-end; }
.bubble { padding: 7px 11px; border-radius: 12px; white-space: pre-wrap; word-wrap: break-word; }
.msg.bot .bubble { background: var(--bubble-bot); border-bottom-left-radius: 4px; }
.msg.user .bubble { background: var(--bubble-user); border-bottom-right-radius: 4px; }
.msg.flash .bubble { animation: flash .6s; }
@keyframes flash { from { outline: 2px solid var(--accent); } to { outline: 2px solid transparent; } }
.note { align-self: center; font-size: 12px; color: var(--muted); background: var(--panel); padding: 3px 10px; border-radius: 999px; }
.kbd { display: grid; gap: 4px; margin-top: 4px; }
.kbd button { background: var(--kbd); border: 0; font-size: 13px; padding: 7px 6px; border-radius: 8px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.kbd button:hover { filter: brightness(1.08); }
.composer { display: flex; gap: 6px; padding: 10px; border-top: 1px solid var(--line); background: var(--panel); }
pre.code { margin: 0; flex: 1; overflow: auto; padding: 14px; background: var(--code-bg); font: 12.5px/1.5 var(--mono); white-space: pre; }
.toolbar { display: flex; gap: 6px; padding: 8px 10px; border-bottom: 1px solid var(--line); align-items: center; }
.log { flex: 1; overflow: auto; padding: 10px 14px; font: 12.5px/1.6 var(--mono); }
.log .warning, .log .error { color: var(--bad); }
.log time { color: var(--muted); margin-right: 8px; }

@media (max-width: 1100px) {
  main { grid-template-columns: 240px minmax(0, 1fr); }
  .right { grid-column: 1 / -1; border-left: 0; border-top: 1px solid var(--line); min-height: 480px; }
}
@media (max-width: 700px) {
  body { display: block; height: auto; }
  main { display: block; }
  section, aside { overflow: visible; }
  aside { border-right: 0; border-bottom: 1px solid var(--line); }
  .right { height: 80vh; }
  header .token { max-width: none; flex: 1 1 100%; }
  .editor { padding: 14px 16px; }
  .btnrow { grid-template-columns: 110px minmax(0, 1fr) auto auto; }
  .btnrow [data-b=text] { grid-area: 1 / 1 / 2 / 3; }
  .btnrow [data-bact=go] { grid-area: 1 / 3; }
  .btnrow [data-bact=del] { grid-area: 1 / 4; }
  .btnrow [data-b=kind] { grid-area: 2 / 1; }
  .btnrow [data-b=value] { grid-area: 2 / 2 / 3 / 5; }
}
</style>
</head>
<body>
<header>
  <input class="name" id="name" aria-label="Название бота">
  <select id="parse" style="width:auto" title="Разметка ответов">
    <option value="HTML">HTML-разметка</option>
    <option value="">Без разметки</option>
  </select>
  <span class="saved" id="saved"></span>
  <span class="grow"></span>
  <input class="token" id="token" type="password" placeholder="Токен от @BotFather" autocomplete="off">
  <button id="apply" hidden title="Перезапустить бота с текущими правками">↻ Применить правки</button>
  <button class="primary" id="run">▶ Запустить</button>
  <span class="pill" id="status">остановлен</span>
</header>

<main>
  <aside>
    <div class="add">
      <button data-add="command">+ Команда</button>
      <button data-add="callback">+ Экран</button>
      <button data-add="text">+ Текст</button>
      <button data-add="fallback">+ Остальное</button>
    </div>
    <div id="list"></div>
  </aside>

  <section><div class="editor" id="editor"></div></section>

  <section class="right">
    <div class="tabs">
      <button data-tab="chat" class="on">Превью</button>
      <button data-tab="code">Код</button>
      <button data-tab="log">Журнал</button>
    </div>
    <div class="pane on" data-pane="chat">
      <div class="chat" id="chat"></div>
      <form class="composer" id="composer">
        <input id="say" placeholder="Напишите боту, например /start" autocomplete="off">
        <button class="primary">↑</button>
        <button type="button" id="reset" title="Очистить чат">⟲</button>
      </form>
    </div>
    <div class="pane" data-pane="code">
      <div class="toolbar">
        <button id="copy">Копировать</button>
        <button id="download">Скачать bot.py</button>
        <span class="saved" id="codehint"></span>
      </div>
      <pre class="code" id="code"></pre>
    </div>
    <div class="pane" data-pane="log">
      <div class="log" id="log"><div class="empty">Запустите бота — здесь появятся входящие обновления и ошибки.</div></div>
    </div>
  </section>
</main>

<script>
const TRIGGERS = {
  command:  { label: "Команда", hint: "Срабатывает на /команду. Латиница, цифры и _." },
  callback: { label: "Экран", hint: "Открывается по нажатию inline-кнопки с этим идентификатором." },
  text:     { label: "Текст", hint: "Точное совпадение без учёта регистра. Несколько вариантов — через |" },
  fallback: { label: "Остальное", hint: "Любое сообщение, которое не подошло ни под что выше." },
};
const $ = (s, root = document) => root.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

let cfg = { name: "", parse_mode: "HTML", handlers: [] };
let sel = 0, issues = [], code = null;

// ---------- сервер ----------
async function api(method, path, body) {
  const res = await fetch(path, {
    method, headers: body ? { "Content-Type": "application/json" } : {},
    body: body ? JSON.stringify(body) : undefined,
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || res.statusText);
  return data;
}

let saveTimer = null, stale = false;
function changed(structural = false) {
  if (running && !stale) { stale = true; $("#apply").hidden = false; }
  if (structural) renderEditor();
  renderList();
  $("#saved").textContent = "…";
  clearTimeout(saveTimer);
  // После вставки/удаления индексы в issues устарели — пересчитываем сразу.
  saveTimer = setTimeout(save, structural ? 0 : 350);
}
async function save() {
  try {
    const r = await api("PUT", "/api/config", cfg);
    issues = r.issues; code = r.code;
    $("#saved").textContent = "сохранено";
  } catch (e) {
    $("#saved").textContent = "не сохранено: " + e.message;
  }
  renderList(); renderIssues(); renderCode();
}

// ---------- список обработчиков ----------
function cmdName(m) { return m.trim().replace(/^\/+/, "").toLowerCase(); }
function variants(m) { return [...new Set(m.split("|").map(v => v.trim().toLowerCase()).filter(Boolean))]; }
function triggerText(h) {
  if (h.trigger === "command") return "/" + (cmdName(h.match) || "…");
  if (h.trigger === "callback") return "⎔ " + (h.match || "…");
  if (h.trigger === "text") return "«" + (variants(h.match).join(" | ") || "…") + "»";
  return "✱ всё остальное";
}
function worst(i) {
  const own = issues.filter(x => x.handler === i);
  return own.some(x => x.level === "error") ? "error" : own.length ? "warning" : "";
}
function renderList() {
  $("#list").innerHTML = cfg.handlers.map((h, i) => {
    const w = worst(i);
    return `<button class="item ${i === sel ? "active" : ""}" data-sel="${i}">
      <div class="trig">${w ? `<span class="dot ${w}"></span>` : ""}${esc(triggerText(h))}
        ${h.buttons.length ? `<span class="tag">${h.buttons.length} кн.</span>` : ""}</div>
      <div class="snippet">${esc(h.reply.replace(/<[^>]+>/g, "") || "— пустой ответ —")}</div>
    </button>`;
  }).join("") || `<div class="empty">Нет обработчиков</div>`;
}
$("#list").addEventListener("click", e => {
  const b = e.target.closest("[data-sel]");
  if (b) select(+b.dataset.sel);
});
function select(i) { sel = i; renderList(); renderEditor(); }

function blank(trigger, match = "") {
  return { trigger, match, reply: "", edit: trigger === "callback", columns: 1, buttons: [] };
}
document.querySelectorAll("[data-add]").forEach(b => b.onclick = () => {
  const t = b.dataset.add;
  cfg.handlers.push(blank(t));
  sel = cfg.handlers.length - 1;
  changed(true);
  $(t === "fallback" ? "#editor [data-f=reply]" : "#editor [data-f=match]").focus();
});

// ---------- редактор ----------
function callbackIds() { return [...new Set(cfg.handlers.filter(h => h.trigger === "callback" && h.match).map(h => h.match))]; }

function renderEditor() {
  const ed = $("#editor");
  const h = cfg.handlers[sel];
  if (!h) { ed.innerHTML = `<div class="empty">Добавьте первый обработчик слева — например, команду /start.</div>`; return; }
  const t = h.trigger;
  ed.innerHTML = `
    <div class="row">
      <h2 style="flex:1">${esc(TRIGGERS[t]?.label || t)} ${sel + 1}</h2>
      <button class="icon" data-act="up" title="Выше" ${sel === 0 ? "disabled" : ""}>↑</button>
      <button class="icon" data-act="down" title="Ниже" ${sel === cfg.handlers.length - 1 ? "disabled" : ""}>↓</button>
      <button class="icon" data-act="dup" title="Дублировать">⧉</button>
      <button class="icon danger" data-act="del" title="Удалить">✕</button>
    </div>
    <div class="field">
      <label>Когда срабатывает</label>
      <div class="seg">${Object.entries(TRIGGERS).map(([k, v]) =>
        `<button data-trigger="${k}" class="${k === t ? "on" : ""}">${v.label}</button>`).join("")}</div>
      <div class="hint">${esc(TRIGGERS[t]?.hint || "")}</div>
    </div>
    ${t === "fallback" ? "" : `<div class="field">
      <label>${t === "command" ? "Команда" : t === "callback" ? "Идентификатор экрана (callback_data)" : "Текст сообщения"}</label>
      ${t === "command"
        ? `<div class="prefixed"><span>/</span><input data-f="match" value="${esc(h.match.replace(/^\/+/, ""))}" placeholder="start"></div>`
        : `<input data-f="match" value="${esc(h.match)}" placeholder="${t === "callback" ? "menu" : "привет | здравствуйте"}" ${t === "callback" ? 'style="font-family:var(--mono)"' : ""}>`}
    </div>`}
    ${t === "callback" ? `<label class="check"><input type="checkbox" data-f="edit" ${h.edit ? "checked" : ""}>
      Заменять сообщение с кнопками, а не присылать новое</label>` : ""}
    <div class="field">
      <label>Ответ бота</label>
      <textarea data-f="reply" placeholder="Текст ответа">${esc(h.reply)}</textarea>
      ${cfg.parse_mode === "HTML" ? `<div class="hint">HTML: &lt;b&gt;жирный&lt;/b&gt;, &lt;i&gt;курсив&lt;/i&gt;, &lt;code&gt;код&lt;/code&gt;, &lt;a href="…"&gt;ссылка&lt;/a&gt;. Символ &lt; пишите как &amp;lt;</div>` : ""}
    </div>
    <div class="field">
      <div class="row" style="margin-bottom:6px">
        <label style="flex:1;margin:0">Кнопки под сообщением</label>
        <label style="margin:0">в ряд</label>
        <select data-f="columns" style="width:auto">${[1,2,3,4].map(n => `<option ${n === h.columns ? "selected" : ""}>${n}</option>`).join("")}</select>
      </div>
      <div id="buttons">${h.buttons.map((b, j) => `
        <div class="btnrow" data-j="${j}">
          <input data-b="text" value="${esc(b.text)}" placeholder="Надпись">
          <select data-b="kind"><option value="callback" ${b.kind === "callback" ? "selected" : ""}>→ экран</option><option value="url" ${b.kind === "url" ? "selected" : ""}>↗ ссылка</option></select>
          <input data-b="value" value="${esc(b.value)}" placeholder="${b.kind === "url" ? "https://…" : "menu"}" ${b.kind === "callback" ? 'list="cb-ids"' : ""}>
          <button class="icon" data-bact="go" title="${b.kind === "callback" ? "Открыть или создать экран" : "Открыть ссылку"}">${b.kind === "callback" ? "→" : "↗"}</button>
          <button class="icon danger" data-bact="del" title="Удалить кнопку">✕</button>
        </div>`).join("")}</div>
      <datalist id="cb-ids">${callbackIds().map(id => `<option value="${esc(id)}">`).join("")}</datalist>
      <button data-act="addbtn">+ Кнопка</button>
    </div>
    <div class="issues" id="issues"></div>`;
  renderIssues();
}

const editor = $("#editor");
editor.addEventListener("input", e => {
  const h = cfg.handlers[sel], el = e.target;
  if (el.dataset.f) {
    const f = el.dataset.f;
    h[f] = f === "edit" ? el.checked : f === "columns" ? +el.value : el.value;
    changed();
  } else if (el.dataset.b) {
    const j = +el.closest("[data-j]").dataset.j;
    h.buttons[j][el.dataset.b] = el.value;
    changed(el.dataset.b === "kind");
  }
});
editor.addEventListener("click", e => {
  const h = cfg.handlers[sel];
  const tb = e.target.closest("[data-trigger]");
  if (tb) {
    const prev = h.trigger;
    h.trigger = tb.dataset.trigger;
    if (h.trigger === "fallback") h.match = "";
    if (h.trigger === "callback" && prev !== "callback") h.edit = true;
    return changed(true);
  }
  const act = e.target.closest("[data-act]")?.dataset.act;
  if (act === "del") { cfg.handlers.splice(sel, 1); sel = Math.max(0, sel - 1); return changed(true); }
  if (act === "dup") { cfg.handlers.splice(sel + 1, 0, structuredClone(h)); sel++; return changed(true); }
  if (act === "up" || act === "down") {
    const to = act === "up" ? sel - 1 : sel + 1;
    [cfg.handlers[sel], cfg.handlers[to]] = [cfg.handlers[to], cfg.handlers[sel]];
    sel = to; return changed(true);
  }
  if (act === "addbtn") {
    h.buttons.push({ text: "", kind: "callback", value: "" });
    changed(true);
    return editor.querySelector(`[data-j="${h.buttons.length - 1}"] [data-b=text]`).focus();
  }
  const bact = e.target.closest("[data-bact]")?.dataset.bact;
  if (bact) {
    const j = +e.target.closest("[data-j]").dataset.j, b = h.buttons[j];
    if (bact === "del") { h.buttons.splice(j, 1); return changed(true); }
    if (b.kind === "url") return b.value && window.open(b.value, "_blank", "noopener");
    openScreen(b);
  }
});

// Кнопка «→»: перейти к экрану, а если его нет — создать. Так меню собирается в пару кликов.
function openScreen(b) {
  if (!b.value.trim()) b.value = slug(b.text) || "screen_" + (cfg.handlers.length + 1);
  const i = cfg.handlers.findIndex(h => h.trigger === "callback" && h.match === b.value);
  if (i >= 0) { sel = i; return changed(true); }
  const back = cfg.handlers[sel];
  const screen = blank("callback", b.value);
  screen.reply = b.text.trim() || b.value;
  if (back.trigger === "callback") screen.buttons.push({ text: "← Назад", kind: "callback", value: back.match });
  cfg.handlers.push(screen);
  sel = cfg.handlers.length - 1;
  changed(true);
  $("#editor [data-f=reply]").select();
}
function slug(s) {
  const tr = {а:"a",б:"b",в:"v",г:"g",д:"d",е:"e",ё:"e",ж:"zh",з:"z",и:"i",й:"i",к:"k",л:"l",м:"m",н:"n",о:"o",п:"p",р:"r",с:"s",т:"t",у:"u",ф:"f",х:"h",ц:"c",ч:"ch",ш:"sh",щ:"sch",ы:"y",э:"e",ю:"yu",я:"ya"};
  return [...s.toLowerCase()].map(c => tr[c] ?? c).join("").replace(/[^a-z0-9]+/g, "_").replace(/^_|_$/g, "").slice(0, 40);
}

function renderIssues() {
  const box = $("#issues");
  editor.querySelectorAll(".bad").forEach(el => el.classList.remove("bad"));
  if (!box) return;
  const own = issues.filter(x => x.handler === sel);
  const global = issues.filter(x => x.handler === null);
  for (const x of own) {
    const m = x.field.match(/^buttons\.(\d+)\.(\w+)$/);
    const el = m ? editor.querySelector(`[data-j="${m[1]}"] [data-b="${m[2]}"]`)
                 : editor.querySelector(`[data-f="${x.field}"]`);
    el?.classList.add("bad");
  }
  const others = issues.filter(x => x.handler !== null && x.handler !== sel && x.level === "error" && cfg.handlers[x.handler]);
  box.innerHTML = [...global, ...own].map(x => `<div class="issue ${x.level}">${esc(x.message)}</div>`).join("")
    + (others.length ? `<div class="issue error">Ошибки в других обработчиках: ${[...new Set(others.map(x => x.handler))]
        .map(i => `<a href="#" data-sel="${i}">${esc(triggerText(cfg.handlers[i]))}</a>`).join(", ")}</div>` : "");
}
editor.addEventListener("click", e => {
  const a = e.target.closest("a[data-sel]");
  if (a) { e.preventDefault(); select(+a.dataset.sel); }
});

$("#name").oninput = e => { cfg.name = e.target.value; changed(); };
$("#parse").onchange = e => { cfg.parse_mode = e.target.value; changed(true); renderChat(); };

// ---------- превью чата: та же логика выбора, что в сгенерированном коде ----------
let chat = [], msgSeq = 0;

function route(kind, value) {
  const hs = cfg.handlers;
  if (kind === "callback") return hs.findIndex(h => h.trigger === "callback" && h.match === value);
  for (let i = 0; i < hs.length; i++) {
    const h = hs[i];
    if (h.trigger === "command") {
      const m = value.match(/^\/([A-Za-z0-9_]+)(@\S+)?(\s|$)/);   // aiogram Command: /start, /start@bot, /start args
      if (m && m[1] === cmdName(h.match)) return i;
    } else if (h.trigger === "text" && variants(h.match).includes(value.toLowerCase())) return i;
  }
  return hs.findIndex(h => h.trigger === "fallback");
}
function botMessage(i) {
  const h = cfg.handlers[i];
  return { from: "bot", id: ++msgSeq, handler: i, text: h.reply, buttons: structuredClone(h.buttons), columns: h.columns };
}
function userSays(text) {
  chat.push({ from: "user", text });
  const i = route("message", text);
  if (i < 0) chat.push({ from: "note", text: "Бот промолчит — нет подходящего обработчика" });
  else { chat.push(botMessage(i)); select(i); }
  renderChat(true);
}
function press(msgId, j) {
  const msg = chat.find(m => m.id === msgId), b = msg.buttons[j];
  if (b.kind === "url") return window.open(b.value, "_blank", "noopener");
  const i = route("callback", b.value);
  if (i < 0) { chat.push({ from: "note", text: `Кнопка «${b.value}» ни к чему не привязана` }); return renderChat(true); }
  select(i);
  if (cfg.handlers[i].edit) {
    Object.assign(msg, botMessage(i), { id: msg.id, flash: true });
    renderChat(false);
  } else { chat.push(botMessage(i)); renderChat(true); }
}
function richText(s) {
  if (cfg.parse_mode !== "HTML") return esc(s);
  // Показываем только безопасный поднабор тегов Telegram.
  return esc(s)
    .replace(/&lt;(\/?)(b|strong|i|em|u|s|code|pre)&gt;/g, "<$1$2>")
    .replace(/&lt;a href=&quot;(https?:\/\/[^&]*)&quot;&gt;(.*?)&lt;\/a&gt;/g, '<a href="$1" target="_blank" rel="noopener">$2</a>')
    .replace(/&amp;(lt|gt|amp|quot);/g, "&$1;");
}
function renderChat(scroll) {
  const box = $("#chat");
  box.innerHTML = chat.map(m => m.from === "note" ? `<div class="note">${esc(m.text)}</div>` : `
    <div class="msg ${m.from} ${m.flash ? "flash" : ""}">
      <div class="bubble">${m.from === "bot" ? richText(m.text) : esc(m.text)}</div>
      ${m.buttons?.length ? `<div class="kbd" style="grid-template-columns:repeat(${Math.min(m.columns, m.buttons.length)},1fr)">${
        m.buttons.map((b, j) => `<button data-msg="${m.id}" data-j="${j}">${esc(b.text || "…")}${b.kind === "url" ? " ↗" : ""}</button>`).join("")}</div>` : ""}
    </div>`).join("") || `<div class="note">Напишите /start, чтобы проверить бота без Telegram</div>`;
  chat.forEach(m => delete m.flash);
  if (scroll) box.scrollTop = box.scrollHeight;
}
$("#chat").addEventListener("click", e => {
  const b = e.target.closest("[data-msg]");
  if (b) press(+b.dataset.msg, +b.dataset.j);
});
$("#composer").onsubmit = e => {
  e.preventDefault();
  const v = $("#say").value;
  if (v.trim()) { userSays(v); $("#say").value = ""; }
};
$("#reset").onclick = () => { chat = []; renderChat(); $("#say").focus(); };

// ---------- код ----------
function renderCode() {
  $("#code").textContent = code ?? "Код появится, когда исправите ошибки (отмечены красным в списке).";
  $("#copy").disabled = $("#download").disabled = !code;
  $("#codehint").textContent = code ? `${code.split("\n").length} строк · aiogram 3` : "";
}
$("#copy").onclick = async () => {
  await navigator.clipboard.writeText(code);
  $("#copy").textContent = "Скопировано"; setTimeout(() => $("#copy").textContent = "Копировать", 1200);
};
$("#download").onclick = () => {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([code], { type: "text/x-python" }));
  a.download = "bot.py"; a.click(); URL.revokeObjectURL(a.href);
};

document.querySelectorAll("[data-tab]").forEach(t => t.onclick = () => {
  document.querySelectorAll("[data-tab]").forEach(x => x.classList.toggle("on", x === t));
  document.querySelectorAll("[data-pane]").forEach(p => p.classList.toggle("on", p.dataset.pane === t.dataset.tab));
});

// ---------- запуск ----------
let polling = null, running = false;
function renderStatus(s) {
  running = s.running;
  if (!running) stale = false;
  $("#apply").hidden = !stale;
  const pill = $("#status");
  pill.className = "pill" + (s.running ? " on" : s.error ? " err" : "");
  pill.textContent = s.running ? `работает · @${s.username}` : s.error ? "упал: " + s.error : "остановлен";
  $("#run").textContent = s.running ? "■ Остановить" : "▶ Запустить";
  $("#run").classList.toggle("primary", !s.running);
  const log = $("#log");
  if (s.log?.length) {
    const atBottom = log.scrollTop + log.clientHeight >= log.scrollHeight - 4;
    log.innerHTML = s.log.map(l => `<div class="${l.level}"><time>${l.time}</time>${esc(l.text)}</div>`).join("");
    if (atBottom) log.scrollTop = log.scrollHeight;
  }
  clearInterval(polling);
  if (s.running) polling = setInterval(async () => renderStatus(await api("GET", "/api/status")), 2000);
}
async function start() {
  clearTimeout(saveTimer); await save();   // запускаем ровно то, что на экране
  $("#status").className = "pill"; $("#status").textContent = "запускаю…";
  const s = await api("POST", "/api/run", { token: $("#token").value });
  stale = false;
  renderStatus(s);
}
async function busy(btn, fn) {
  btn.disabled = true;
  try { await fn(); }
  catch (e) { $("#status").className = "pill err"; $("#status").textContent = e.message; }
  finally { btn.disabled = false; }
}
$("#run").onclick = () => busy($("#run"), async () => running ? renderStatus(await api("POST", "/api/stop", {})) : start());
// Живой бот не подхватывает правки сам: перезапуск занимает несколько секунд и рвёт диалоги.
$("#apply").onclick = () => busy($("#apply"), start);
document.addEventListener("keydown", e => {
  if ((e.ctrlKey || e.metaKey) && e.key === "s") { e.preventDefault(); clearTimeout(saveTimer); save(); }
});

// ---------- старт ----------
(async () => {
  const r = await api("GET", "/api/config");
  cfg = r.config; issues = r.issues; code = r.code;
  $("#name").value = cfg.name; $("#parse").value = cfg.parse_mode;
  if (r.env_token) $("#token").placeholder = "Токен из BOT_TOKEN";
  document.title = `${cfg.name} — конструктор ботов`;
  $("#saved").textContent = r.path.split(/[\\/]/).pop();
  $("#saved").title = r.path;
  renderList(); renderEditor(); renderCode(); renderChat();
  renderStatus(await api("GET", "/api/status"));
})();
</script>
</body>
