[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "yandex-nosite"
version = "0.1.0"
description = "Поиск бизнесов без сайта по данным Яндекс Карт (официальный Search API)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
bots = ["aiogram>=3.4"]

[project.scripts]
yandex-nosite = "yandex_nosite.cli:main"
botbuilder = "botbuilder.__main__:main"

[tool.setuptools]
packages = ["yandex_nosite", "botbuilder"]

[tool.setuptools.package-data]
yandex_nosite = ["templates/*.html"]
botbuilder = ["static/*.html"]
